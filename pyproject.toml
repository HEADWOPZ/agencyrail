[project]
name = "agencyrail"
version = "0.1.0"
description = "Crypto-native AI agency ops kit — intake to retainer for wallet, dApp, and protocol clients."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
  { name = "Kevin Lance Murray" },
]
keywords = ["agency", "crypto", "wallet", "dapp", "crm", "ops"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business",
]
dependencies = [
  "typer>=0.12.5",
  "rich>=13.9.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "jinja2>=3.1.4",
  "python-multipart>=0.0.12",
  "httpx>=0.27.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
]

[project.scripts]
agencyrail = "agencyrail.cli:app"

[project.urls]
Homepage = "https://github.com/HEADWOPZ/agencyrail"
Repository = "https://github.com/HEADWOPZ/agencyrail"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agencyrail = ["templates/*.j2", "desk/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
